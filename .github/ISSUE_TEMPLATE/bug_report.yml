name: "Bug report"
description: "Report a reproducible defect in Estampes."
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please avoid posting access keys,
        bearer URLs (including `?key=`), personal images, private logs, or credentials.
        Report security vulnerabilities privately using [SECURITY.md](https://github.com/Curium-3391/Estampes/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: "Estampes version"
      description: "From /version or package.json, e.g. 0.20.0."
      placeholder: "0.20.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "How are you running Estampes?"
      options:
        - "Docker Compose"
        - "Node.js"
        - "Heroku / Render / other managed host"
        - "Other / unknown"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: "MCP client or host (if relevant)"
      options:
        - "ChatGPT"
        - "Claude"
        - "Other MCP client"
        - "Not applicable / server only"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Use synthetic images or other shareable test data when possible."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Sanitized logs, screenshots, or test case"
      description: "Redact keys, tokens, query strings, personal data, and service URLs before sharing."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "Before submitting"
      options:
        - label: "I checked existing Issues and the troubleshooting documentation."
          required: true
        - label: "I removed secrets and private user data from this report."
          required: true
