name: Docker image
# Builds linux/amd64 + linux/arm64 on every PR (no push) and publishes
# ghcr.io/<owner>/estampes on main and on v* tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' estampes)
            [ "$status" = healthy ] && break; sleep 2
          done
          docker compose ps
          curl -fsS http://127.0.0.1:8787/healthz
          test "$(docker compose exec -T estampes id -u)" != 0
      - name: Logs
        if: always()
        run: docker compose logs
  image:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/estampes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
