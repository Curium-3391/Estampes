name: Docker image
# Both channels validate the exact commit that will be built.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      (github.ref == 'refs/heads/main' &&
        ((github.event_name == 'push' && !github.event.deleted) || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact event and ref
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main|push:refs/tags/v*) ;;
            *) echo "::error::Unsupported publication ref"; exit 1 ;;
          esac
      - if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.ref_type == 'tag'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release tag and main ancestry
        if: github.ref_type == 'tag'
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
  full-tests:
    needs: verify
    uses: ./.github/workflows/m0.yml
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' estampes)
            [ "$status" = healthy ] && break; sleep 2
          done
          docker compose ps
          curl -fsS http://127.0.0.1:8787/healthz
          test "$(docker compose exec -T estampes id -u)" != 0
          # Secure defaults: closed without the generated key, open with it.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/mcp)" = 401
          key=$(docker compose exec -T estampes cat /data/access-key)
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787/api/v1/canvas/0123456789abcdef?key=$key")" = 404
          ! docker compose exec -T estampes touch /app/probe
          # The SymPy calculator: healthy, no network, no published port,
          # reachable only through the socket, and it really computes.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' estampes-cas)
            [ "$status" = healthy ] && break; sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' estampes-cas)" = healthy
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' estampes-cas)" = none
          test -z "$(docker inspect -f '{{json .NetworkSettings.Ports}}' estampes-cas | grep -v '^{}$')"
          test "$(docker compose exec -T cas id -u)" != 0
          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"available":true'
          docker compose exec -T estampes node -e "
            import('/app/src/cas/client.js').then(async ({ createCasClient }) => {
              const c = createCasClient({ socketPath: '/run/estampes-cas/cas.sock' });
              const r = await c.compute({ operation: 'differentiate', input: { text: 'sin(x^2)' }, params: { variable: 'x' } });
              if (r.exact.plain !== '2*x*cos(x^2)') throw new Error(r.exact.plain);
              const bad = await c.compute({ operation: 'evaluate', input: { text: 'exec(1)' } }).then(() => 'ran', (e) => e.code);
              if (bad !== 'syntax') throw new Error('injection not refused: ' + bad);
            }).catch((e) => { console.error(e); process.exit(1); });"
          # Stop the calculator: Core stays healthy and reports it.
          docker compose stop cas
          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"available":false'
          docker compose start cas
          # The tunnel profile's compose file is valid (no network use here).
          docker compose --profile tunnel config --services | grep -qx tunnel
      - name: Verify Edge Compose isolation
        env:
          ESTAMPES_BIND: 0.0.0.0
          ESTAMPES_HOST_PORT: '8787'
        run: |
          printf '\nESTAMPES_ACCESS_KEY=stable-smoke-only\n' >> .env
          docker compose -p estampes-edge -f compose.yaml -f compose.edge.yaml config --format json |
            jq -e '
              .name == "estampes-edge" and
              (.volumes | keys == ["edge-cas-run", "edge-data", "edge-uva"]) and
              (.services.estampes |
                .image == "ghcr.io/curium-3391/estampes:edge" and
                (has("build") or has("container_name") or has("env_file") | not) and
                (.environment | has("ESTAMPES_ACCESS_KEY") | not) and
                (.ports | length == 1 and .[0].host_ip == "127.0.0.1" and .[0].published == "8788") and
                ([.volumes[] | [.source, .target]] | sort ==
                  [["edge-cas-run", "/run/estampes-cas"], ["edge-data", "/data"], ["edge-uva", "/uva-beta"]])) and
              (.services.cas |
                .network_mode == "none" and
                (has("container_name") or has("env_file") | not) and
                ([.volumes[].source] == ["edge-cas-run"]))
            '
      - name: Logs
        if: always()
        run: docker compose logs
  image:
    runs-on: ubuntu-latest
    needs: [verify, full-tests, smoke]
    concurrency:
      group: docker-publish-${{ github.ref_type == 'branch' && 'edge' || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check whether Edge is still on current main
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping Edge publication because main has advanced."
              exit 0
            fi
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
      - if: steps.publish.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.publish.outputs.allowed == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.publish.outputs.allowed == 'true'
        uses: docker/setup-buildx-action@v4
      - id: meta
        if: steps.publish.outputs.allowed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/estampes
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
      - if: steps.publish.outputs.allowed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.publish.outputs.allowed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
