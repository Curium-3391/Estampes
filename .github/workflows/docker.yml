name: Docker image
# Runs only when a v* tag is pushed (see docs/RELEASE.md): checks the release
# metadata, runs the full suite and compose smoke test, then publishes the image
# ghcr.io/<owner>/estampes as X.Y.Z, latest (stable tags only) and sha-<short>.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
  full-tests:
    needs: verify
    uses: ./.github/workflows/m0.yml
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' estampes)
            [ "$status" = healthy ] && break; sleep 2
          done
          docker compose ps
          curl -fsS http://127.0.0.1:8787/healthz
          test "$(docker compose exec -T estampes id -u)" != 0
          # Secure defaults: closed without the generated key, open with it.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/mcp)" = 401
          key=$(docker compose exec -T estampes cat /data/access-key)
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787/api/v1/canvas/0123456789abcdef?key=$key")" = 404
          ! docker compose exec -T estampes touch /app/probe
          # The SymPy calculator: healthy, no network, no published port,
          # reachable only through the socket, and it really computes.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' estampes-cas)
            [ "$status" = healthy ] && break; sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' estampes-cas)" = healthy
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' estampes-cas)" = none
          test -z "$(docker inspect -f '{{json .NetworkSettings.Ports}}' estampes-cas | grep -v '^{}$')"
          test "$(docker compose exec -T cas id -u)" != 0
          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"available":true'
          docker compose exec -T estampes node -e "
            import('/app/src/cas/client.js').then(async ({ createCasClient }) => {
              const c = createCasClient({ socketPath: '/run/estampes-cas/cas.sock' });
              const r = await c.compute({ operation: 'differentiate', input: { text: 'sin(x^2)' }, params: { variable: 'x' } });
              if (r.exact.plain !== '2*x*cos(x^2)') throw new Error(r.exact.plain);
              const bad = await c.compute({ operation: 'evaluate', input: { text: 'exec(1)' } }).then(() => 'ran', (e) => e.code);
              if (bad !== 'syntax') throw new Error('injection not refused: ' + bad);
            }).catch((e) => { console.error(e); process.exit(1); });"
          # Stop the calculator: Core stays healthy and reports it.
          docker compose stop cas
          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"available":false'
          docker compose start cas
          # The tunnel profile's compose file is valid (no network use here).
          docker compose --profile tunnel config --services | grep -qx tunnel
      - name: Logs
        if: always()
        run: docker compose logs
  image:
    runs-on: ubuntu-latest
    needs: [full-tests, smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/estampes
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
