name: PR baseline gate

# Keep the baseline job name stable for branch rules. Select the tier inside
# the job so a documentation-only PR still gets the required status.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the entire PR without the workflow path filter's file limit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select test tier
        id: tier
        run: node scripts/ci-tier.mjs
      - name: Syntax check
        run: node --check server.js
      - name: Documentation consistency
        run: npm run docs:check
      - uses: ./.github/actions/validation
        if: steps.tier.outputs.tier != 'docs'
        with:
          tier: ${{ steps.tier.outputs.tier }}
