name: PR baseline gate

# Branch rules require the final baseline job on every PR and merge-group SHA.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the entire PR without the workflow path filter's file limit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select test tier
        id: tier
        run: node scripts/ci-tier.mjs
      - name: Syntax check
        run: node --check server.js
      - name: Documentation consistency
        run: npm run docs:check
      - name: Hard-coded text and catalogs
        run: npm run i18n:check -- --strict
      - uses: ./.github/actions/validation
        if: steps.tier.outputs.tier == 'fast'
        with:
          tier: ${{ steps.tier.outputs.tier }}

  full:
    name: Full validation (${{ matrix.suite }})
    needs: quick
    if: needs.quick.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6', legacy]
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR-1B evidence test reads historical workflow blobs.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/validation
        with:
          tier: full
          suite: ${{ matrix.suite }}

  baseline:
    name: baseline
    needs: [quick, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected validation
        env:
          TIER: ${{ needs.quick.outputs.tier }}
          QUICK_RESULT: ${{ needs.quick.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          echo "Tier: $TIER | quick: $QUICK_RESULT | full: $FULL_RESULT"
          test "$QUICK_RESULT" = success || exit 1
          case "$TIER:$FULL_RESULT" in
            docs:skipped|fast:skipped|full:success) exit 0 ;;
            *) exit 1 ;;
          esac
