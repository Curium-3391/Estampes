name: PR baseline gate

# The required 'baseline' job ALWAYS reports on PRs, including docs-only PRs.
# Do not require conditional/paths-filtered jobs in branch protection.
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.risk.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files; unknown always means full
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-scope.mjs

  quick:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check server syntax
        run: node --check server.js
      - name: Check documentation
        run: npm run docs:check
      - name: Install dependencies for fast changes
        if: needs.classify.outputs.mode == 'fast'
        run: npm ci --no-audit --no-fund
      - name: Run fast functional regression tests
        if: needs.classify.outputs.mode == 'fast'
        run: node scripts/ci-fast-tests.mjs

  full-tests:
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    uses: ./.github/workflows/m0.yml

  baseline:
    name: baseline
    if: always()
    needs: [classify, quick, full-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse to pass missing, skipped, or failed required verification
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
          FULL_RESULT: ${{ needs.full-tests.result }}
          TEST_MODE: ${{ needs.classify.outputs.mode }}
        run: |
          test "$CLASSIFY_RESULT" = success
          test "$QUICK_RESULT" = success
          case "$TEST_MODE" in
            full) test "$FULL_RESULT" = success ;;
            docs|fast) test "$FULL_RESULT" = skipped ;;
            *) echo "Unknown or missing test mode: $TEST_MODE" >&2; exit 1 ;;
          esac
