name: Docs checks
# PR docs are checked by the always-present PR baseline gate. Run this only
# on main so a feature branch doesn't pay for both push and PR checks.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/check-docs.mjs'
      - 'scripts/docs-allowlist.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-docs.mjs
