name: M0 full checks

# Slow persistence/UVA and browser regression suite: called for high-risk PRs,
# before Docker releases, manually, and once a week. No push/PR duplication.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Optional PDF support, so its tests run here (they skip without it).
      - run: npm install --no-save --no-audit --no-fund pdfjs-dist@4.10.38 @napi-rs/canvas
      - run: npm test
      # Retain legacy-store compatibility as a separately exercised mode.
      - run: node --test tests/claims-mcp.test.js tests/workspace-mcp.test.js tests/gesture-mcp.test.js tests/bundle-mcp.test.js tests/geometry-tools.test.js tests/derived-view.test.js tests/upload-e2e.test.js tests/cards-e2e.test.js tests/surface.test.js
        env:
          ESTAMPES_CANVAS_STORE: legacy
      - run: npm run docs:check
      - run: node --check server.js
  cas-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cas-service/requirements.lock
      - run: pip install -r cas-service/requirements.lock
      - run: python -m unittest discover -s cas-service/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/cas-module.test.js
      - run: node --test tests/surface.test.js
      # Real server + SymPy + browser in a fake host (not a live ChatGPT run).
      - run: npm install --no-save --no-audit --no-fund playwright-core
      - run: node --test tests/zoom-perf.test.js tests/bundle-extras.test.js tests/workbench-e2e.test.js tests/layers-e2e.test.js tests/layer-appearance-e2e.test.js tests/upload-e2e.test.js tests/surface-open.test.js tests/surface-refresh.test.js
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ESTAMPES_E2E_SHOTS: ${{ runner.temp }}/workbench-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-screenshots
          path: ${{ runner.temp }}/workbench-shots
          if-no-files-found: ignore
