name: M0 checks
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # Optional PDF support, so its tests run here (they skip without it).
      - run: npm install --no-save --no-audit --no-fund pdfjs-dist@4.10.38 @napi-rs/canvas
      - run: npm test
      - run: node --check server.js
