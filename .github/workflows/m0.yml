name: M0 checks
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # Optional PDF support, so its tests run here (they skip without it).
      - run: npm install --no-save --no-audit --no-fund pdfjs-dist@4.10.38 @napi-rs/canvas
      - run: npm test
      - run: npm run docs:check
      - run: node --check server.js
  cas-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r cas-service/requirements.lock
      - run: python -m unittest discover -s cas-service/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # The Node CAS tests start the real Python service.
      - run: node --test tests/cas-module.test.js
      - run: node --test tests/surface.test.js
      # Browser test of the workbench: real server, real SymPy, real widget,
      # driven by the runner's Chrome. (A live ChatGPT host is not covered.)
      - run: npm install --no-save --no-audit --no-fund playwright-core
      - run: node --test tests/bundle-extras.test.js tests/workbench-e2e.test.js tests/layers-e2e.test.js tests/surface-open.test.js tests/surface-refresh.test.js
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ESTAMPES_E2E_SHOTS: ${{ runner.temp }}/workbench-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-screenshots
          path: ${{ runner.temp }}/workbench-shots
          if-no-files-found: ignore
