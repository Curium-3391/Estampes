name: M0 checks
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # Optional PDF support, so its tests run here (they skip without it).
      - run: npm install --no-save --no-audit --no-fund pdfjs-dist@4.10.38 @napi-rs/canvas
      - run: npm test
      - run: node --check server.js
  cas-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r cas-service/requirements.lock
      - run: python -m unittest discover -s cas-service/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # The Node CAS tests start the real Python service.
      - run: node --test tests/cas-module.test.js
