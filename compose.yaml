# docker compose up -d
# Settings come from .env (copy .env.example). Data lives in the named
# volume "estampes-data" and survives `docker compose down` and updates;
# only `docker compose down -v` deletes it.
services:
  estampes:
    build: .
    image: estampes:local
    container_name: estampes
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container these stay fixed; change ESTAMPES_HOST_PORT
      # in .env to publish on another host port.
      PORT: "8787"
      ESTAMPES_STORAGE_DIR: /data
    ports:
      - "${ESTAMPES_HOST_PORT:-8787}:8787"
    volumes:
      - estampes-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  estampes-data:
