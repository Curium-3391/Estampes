# docker compose up -d                      (this machine only)
# docker compose --profile tunnel up -d     (plus a temporary public https address)
# Settings come from .env (copy .env.example). Data lives in the named
# volume "estampes-data" and survives `docker compose down` and updates;
# only `docker compose down -v` deletes it.
services:
  estampes:
    build: .
    image: estampes:local
    container_name: estampes
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container these stay fixed; change ESTAMPES_HOST_PORT
      # in .env to publish on another host port.
      PORT: "8787"
      ESTAMPES_STORAGE_DIR: /data
      ESTAMPES_REQUIRE_KEY: "1"
      # Read the quick tunnel's address when the "tunnel" profile runs.
      ESTAMPES_TUNNEL_METRICS: http://tunnel:20241
      # The SymPy calculator service (below) shares this one socket volume.
      ESTAMPES_CAS_SOCKET: /run/estampes-cas/cas.sock
    ports:
      # Only this machine can reach the server by default; put a reverse
      # proxy or tunnel with https in front. ESTAMPES_BIND=0.0.0.0 in .env
      # opens it to the network.
      - "${ESTAMPES_BIND:-127.0.0.1}:${ESTAMPES_HOST_PORT:-8787}:8787"
    volumes:
      - estampes-data:/data
      - cas-run:/run/estampes-cas
    # Least privilege: nothing but /data (and a small /tmp) is writable, no
    # Linux capabilities, no privilege escalation, bounded processes.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The scientific calculator (SymPy). No network, no data volume, nothing
  # writable but a small /tmp: its only way in or out is the Unix socket on
  # the cas-run volume, which only Estampes (uid 1000) may open. If it is
  # stopped, plotting and annotation keep working; only calculations fail.
  cas:
    build: ./cas-service
    image: estampes-cas:local
    container_name: estampes-cas
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m
    volumes:
      - cas-run:/run/estampes-cas
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Optional: a temporary public https address with no account and no
  # router setup.  docker compose --profile tunnel up -d
  # then read the ChatGPT connector URL with:
  #   docker compose logs estampes | grep tunnel
  # The address changes whenever this container restarts; for lasting use
  # put your own domain or a named tunnel in front instead.
  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://estampes:8787
    depends_on:
      - estampes
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  estampes-data:
  cas-run:
