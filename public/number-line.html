<!doctype html>
<html lang="__ESTAMPES_LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estampes — Number Line</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{margin:0;padding:12px;color:CanvasText;background:Canvas}
main{max-width:680px;margin:auto;border:1px solid #8885;border-radius:14px;padding:16px}
h2{font-size:1rem;margin:0 0 6px}.muted{color:GrayText;font-size:.85rem}
svg{width:100%;height:auto;touch-action:manipulation;cursor:crosshair;display:block}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{padding:8px 14px;border-radius:10px;border:1px solid #8886;background:transparent;color:inherit}
button.primary{background:#5865b9;color:white;border-color:transparent}
button:disabled{opacity:.5}
#status{min-height:1.5rem;font-size:.85rem}
</style></head><body><main>
<h2>Estampes · M0 Number Line <small style="font-size:.65rem;color:#8b99ab">v0.3.1</small></h2><p class="muted" data-i18n="nl.intro"></p>
<svg id="line" viewBox="0 0 560 140" role="img" data-i18n-aria-label="nl.lineLabel">
<line x1="35" y1="70" x2="525" y2="70" stroke="currentColor" stroke-width="2"/>
<path d="M35 70 l10 -5v10z M525 70 l-10 -5v10z" fill="currentColor"/>
<g id="ticks"></g>
<g id="assistant"></g><g id="user"></g></svg>
<div class="controls"><span id="selection" data-i18n="nl.none"></span><button id="send" class="primary" disabled data-i18n="nl.send"></button><button id="reset" data-i18n="nl.reset"></button></div>
<p id="status" class="muted" aria-live="polite" data-i18n="nl.connecting"></p>
</main>
<script type="module">
__ESTAMPES_I18N__
const NS="http://www.w3.org/2000/svg", svg=document.querySelector("#line");
const ticks=document.querySelector("#ticks"),assistant=document.querySelector("#assistant"),user=document.querySelector("#user");
const status=document.querySelector("#status"),send=document.querySelector("#send"),selection=document.querySelector("#selection");
let selected=null, target=2, ready=false, rpcId=0;
const requests=new Map();
const pos=(n)=>70+(n+4)*52.5;
const el=(tag,attrs,parent)=>{const node=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);parent.append(node);return node};
for(let n=-4;n<=4;n++){const x=pos(n);el("line",{x1:x,y1:63,x2:x,y2:77,stroke:"currentColor","stroke-width":2},ticks);const t=el("text",{x,y:99,"text-anchor":"middle",fill:"currentColor","font-size":15},ticks);t.textContent=n; const hit=el("rect",{x:x-25,y:40,width:50,height:64,fill:"transparent",role:"button",tabindex:0,"aria-label":i18nT("nl.pickLabel",{n})},ticks);hit.addEventListener("click",()=>pick(n));hit.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(n)}})}
function marker(parent,n,color,caption){parent.replaceChildren();const x=pos(n);el("circle",{cx:x,cy:70,r:8,fill:color},parent);const t=el("text",{x,y:31,"text-anchor":"middle",fill:color,"font-weight":700,"font-size":14},parent);t.textContent=caption;}
function pick(n){selected=n;marker(user,n,"#4e9cec","YOU");selection.textContent=t("nl.picked",{n});send.disabled=!ready;}
function fromTool(response){const data=response?.structuredContent;if(data?.kind!=="estampes.number_line")return;if(Number.isInteger(data.target)&&data.target>=-4&&data.target<=4){target=data.target;marker(assistant,target,"#d5a054","AI");}}
marker(assistant,target,"#d5a054","AI");
function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;requests.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");setTimeout(()=>{if(requests.has(id)){requests.delete(id);reject(Error("Host did not answer"))}},10000)})}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const msg=event.data;if(msg?.jsonrpc!=="2.0")return;if(typeof msg.id==="number"){const p=requests.get(msg.id);if(!p)return;requests.delete(msg.id);msg.error?p.reject(msg.error):p.resolve(msg.result);return}if(msg.method==="ui/notifications/tool-result")fromTool(msg.params);if(msg.method==="ui/notifications/tool-input"){const n=msg.params?.arguments?.target;if(Number.isInteger(n)&&n>=-4&&n<=4){target=n;marker(assistant,target,"#d5a054","AI");}}});
(async()=>{try{await request("ui/initialize",{appInfo:{name:"estampes-number-line",version:"0.1.0"},appCapabilities:{},protocolVersion:"2026-01-26"});notify("ui/notifications/initialized",{});ready=true;send.disabled=selected===null;status.textContent=t("nl.ready");}catch(err){status.textContent=t("nl.notConnected",{message:String(err.message||err)});}})();
send.addEventListener("click",async()=>{
 if(!ready||selected===null)return;
 const value=selected;
 send.disabled=true;
 const payload={
   schemaVersion:"0.1-draft",
   imageId:"number-line-m0",
   author:"user",
   type:"point",
   value,
   x:(value+4)/8,
   y:0.5
 };

 // Step 1: Verify the UI-to-server path. A failed tool must not prevent
 // sending the selection directly to the conversation.
 let validationOk=false;
 let validationError="";
 status.textContent=t("nl.validating");
 try {
   const result=await request("tools/call",{
     name:"record_number_line_selection",
     arguments:{value}
   });
   if(result?.isError)throw Error("MCP tool returned isError");
   const data=result?.structuredContent;
   if(data?.kind!=="estampes.user_selection" || data?.value!==value ||
      Math.abs(data.x-payload.x)>1e-9) {
     throw Error("Unexpected tool result");
   }
   validationOk=true;
 } catch(err) {
   validationError=String(err?.message||err);
 }

 // Step 2: Send actual user intent to the model. This is independent
 // of server validation; a tools/call result is NOT itself a user message.
 status.textContent=validationOk
   ?t("nl.sendingVerified")
   :t("nl.sendingUnverified");
 try {
// i18n-ignore-start: user-voice text sent to the AI (RFC class T2, Phase 3).
   const result=await request("ui/message",{
     role:"user",
     content:[{
       type:"text",
       text:"我在 Estampes 的 -4 至 4 數線上指向 "+value+
         "。標註："+JSON.stringify(payload)+
         "。請確認你收到我指認的數字。"
     }]
   });
// i18n-ignore-end
   if(result?.isError)throw Error("Host returned isError");
   status.textContent=validationOk
     ?t("nl.sentVerified")
     :t("nl.sentUnverified",{error:validationError});
 } catch(err) {
   status.textContent=t(validationOk?"nl.bridgeFailedVerified":"nl.bridgeFailedUnverified",
     {error:validationError,message:String(err?.message||err),value,x:payload.x});
 }
 send.disabled=false;
});
document.querySelector("#reset").addEventListener("click",()=>{selected=null;user.replaceChildren();selection.textContent=t("nl.none");send.disabled=true;});
</script></body></html>
