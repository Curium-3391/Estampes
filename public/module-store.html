<!doctype html>
<html lang="__ESTAMPES_LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estampes Store</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif;--line:#8885;--muted:GrayText;--accent:#356BD6;--low:#2E8B57;--medium:#C98A00;--high:#D1495B}
*{box-sizing:border-box}body{margin:0;padding:10px;background:Canvas;color:CanvasText}
main{max-width:760px;margin:auto;border:1px solid var(--line);border-radius:14px;padding:14px}
header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
h2{font-size:1.05rem;margin:0}h3{font-size:1rem;margin:0 0 4px}small,.muted{color:var(--muted)}small{font-size:.75rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
button{font:inherit;color:inherit;background:transparent;border:1px solid #8886;border-radius:9px;padding:8px 12px;cursor:pointer;min-height:40px}
button[aria-pressed="true"],button.primary{background:var(--accent);color:#fff;border-color:transparent}
button.danger{border-color:var(--high);color:var(--high)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #8887;background:Canvas;color:CanvasText;min-height:40px}
.filters{display:flex;gap:6px;flex-wrap:wrap}.filters input{flex:1 1 180px}
ul.cards{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:.72rem;border-radius:999px;padding:2px 8px;border:1px solid #8886}
.badge.enabled{background:var(--low);color:#fff;border-color:transparent}
.badge.low{color:var(--low);border-color:var(--low)}.badge.medium{color:var(--medium);border-color:var(--medium)}.badge.high{color:var(--high);border-color:var(--high)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0;font-size:.88rem}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.perm{display:flex;gap:8px;align-items:baseline;font-size:.88rem;margin:4px 0}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.box.warn{border-color:var(--medium)}.box.alert{border-color:var(--high)}
ol.events{list-style:none;padding:0;margin:8px 0;font-size:.84rem;display:grid;gap:6px}
ol.events li{border-bottom:1px solid var(--line);padding-bottom:6px}
#status{font-size:.84rem;color:var(--muted);min-height:1.2em;margin:8px 0 0}
.caps{margin:6px 0;padding-left:18px;font-size:.86rem}
code{font-size:.82rem;overflow-wrap:anywhere}
</style></head>
<body><main>
<header><h2>Estampes Store</h2><small id="server"></small></header>
<nav>
 <button data-tab="browse" aria-pressed="true"></button>
 <button data-tab="installed" aria-pressed="false"></button>
 <button data-tab="activity" aria-pressed="false"></button>
</nav>
<section id="view" aria-live="polite"></section>
<p id="status" role="status"></p>
</main>
<script type="module">
__ESTAMPES_I18N__
document.querySelector("#server").textContent=t("store.subtitle",{version:"__ESTAMPES_VERSION__"});
document.querySelector("nav").setAttribute("aria-label",t("store.nav.label"));
for(const b of document.querySelectorAll("[data-tab]"))b.textContent=t("store.tab."+b.dataset.tab);
document.querySelector("#status").textContent=t("store.status.connecting");
const view=document.querySelector("#view"),status=document.querySelector("#status");
const tabs=[...document.querySelectorAll("[data-tab]")];
const tmap=(prefix,keys)=>Object.fromEntries(keys.map(k=>[k,t(prefix+k)]));
const CATEGORY=tmap("store.category.",["math","diagram","analysis","text","astronomy","electronics","utility","other"]);
const STATE=tmap("store.state.",["available","installed","enabled","disabled","failed"]);
const RISK=tmap("store.risk.",["low","medium","high"]);
const ACTION=tmap("store.action.",["enable","disable","install","update","rollback","uninstall","purge"]);
const KIND=tmap("store.event.",["run", "run.failed", "run.rejected", "plan.created", "plan.committed", "plan.refused", "plan.failed", "package.staged", "package.verified", "package.rejected", "package.activated", "package.rolledback", "admin.failed", "job"]);
let tab="browse",modules=[],available=[],actions=["enable","disable"],admin={configured:false},detail=null,plan=null,consents=new Map(),ready=false,rpcId=0,query="",category="";
const pending=new Map();
function el(tag,props={},...kids){const n=document.createElement(tag);for(const [k,v] of Object.entries(props)){if(k==="dataset")Object.assign(n.dataset,v);else if(k in n)n[k]=v;else n.setAttribute(k,v);}n.append(...kids.filter(k=>k!==null&&k!==undefined&&k!==false));return n;}
const text=s=>String(s??"");
const badge=(t,cls="")=>el("span",{className:"badge "+cls,textContent:t});
function setTab(t){tab=t;detail=null;plan=null;for(const b of tabs)b.setAttribute("aria-pressed",String(b.dataset.tab===t));render();if(t==="activity")loadActivity();}
for(const b of tabs)b.addEventListener("click",()=>setTab(b.dataset.tab));

function moduleCard(m){
 const li=el("li",{className:"card"});
 li.append(el("div",{className:"row"},el("h3",{textContent:m.name}),badge(STATE[m.state]??m.state,m.state==="enabled"?"enabled":""),badge(CATEGORY[m.category]??m.category),
  badge(m.source==="builtin"?t("store.source.builtin"):t("store.source.package")),badge(RISK[m.risk]??m.risk,m.risk)));
 li.append(el("p",{textContent:m.description,style:"margin:0;font-size:.9rem"}));
 li.append(el("small",{textContent:m.id+" · "+m.version+" · "+m.publisher}));
 const row=el("div",{className:"row"});
 row.append(el("button",{textContent:t("store.button.details"),onclick:()=>openDetail(m.id)}));
 if(m.state!=="enabled"&&actions.includes("enable"))row.append(el("button",{className:"primary",textContent:t("store.action.enable"),disabled:!ready,onclick:()=>preparePlan("enable",m.id)}));
 if(m.state==="enabled")row.append(el("button",{textContent:t("store.action.disable"),disabled:!ready,onclick:()=>preparePlan("disable",m.id)}));
 li.append(row);return li;
}
function renderList(){
 const filters=el("div",{className:"filters"});
 const search=el("input",{type:"search",placeholder:t("store.search.placeholder"),value:query,"aria-label":t("store.search.label")});
 search.addEventListener("input",()=>{query=search.value;renderCards();});
 const cat=el("select",{"aria-label":t("store.category.label")},el("option",{value:"",textContent:t("store.category.all")}),...Object.entries(CATEGORY).map(([k,v])=>el("option",{value:k,textContent:v,selected:k===category})));
 cat.addEventListener("change",()=>{category=cat.value;renderCards();});
 filters.append(search,cat);
 const list=el("ul",{className:"cards"});
 const renderCards=()=>{
  const q=query.trim().toLowerCase();
  const shown=modules.filter(m=>(tab!=="installed"||m.state==="enabled"||m.state==="installed"||m.state==="disabled"||m.source==="package")&&(!category||m.category===category)&&
   (!q||[m.name,m.id,m.description,...m.capabilities.map(c=>c.title+" "+c.id)].join(" ").toLowerCase().includes(q)));
  list.replaceChildren(...shown.map(moduleCard));
  if(!shown.length)list.append(el("li",{className:"muted",textContent:tab==="installed"?t("store.list.noneEnabled"):t("store.list.noMatch")}));
 };
 renderCards();
 view.replaceChildren(filters,list);
 if(tab==="browse"&&available.length){
  const box=el("div",{className:"box"},el("h3",{textContent:t("store.packages.title")}),el("small",{className:"muted",textContent:t("store.packages.note")}));
  const ul=el("ul",{className:"cards"});
  for(const p of available){
   if(p.error){ul.append(el("li",{className:"card"},el("strong",{textContent:p.file}),el("small",{className:"muted",textContent:t("store.packages.cannotInstall",{error:p.error})})));continue;}
   ul.append(el("li",{className:"card"},el("div",{className:"row"},el("strong",{textContent:p.name||p.id}),badge(p.version),badge(p.signed?t("store.packages.signed",{signer:p.signer||""}):t("store.packages.unsigned"))),
   el("small",{textContent:p.id+(p.installed?t("store.packages.installedVersion",{version:p.installed}):"")}),
   el("div",{className:"row"},el("button",{className:"primary",disabled:!ready,textContent:p.installed?t("store.packages.updateTo",{version:p.version}):t("store.action.install"),onclick:()=>preparePlan(p.installed?"update":"install",p.id,p.version)}))));}
  box.append(ul);view.append(box);
 }
 if(!admin.configured)view.append(el("p",{className:"muted",style:"font-size:.8rem",textContent:t("store.admin.notConfigured")}));
}
const LATENCY=tmap("store.latency.",["instant","seconds","minutes","hours"]),RELIABILITY=tmap("store.reliability.",["exact","estimate","heuristic","external"]);
// One capability's "know before you use it" sheet; folded so the list stays short.
function capProfile(c){
 const p=c.profile;if(!p)return el("span");
 const box=el("details",{className:"profile"},el("summary",{textContent:t("store.profile.summary")+(c.async?t("store.profile.async"):"")}));
 const row=(k,v)=>{if(v)box.append(el("div",{},el("strong",{textContent:t("store.profile.labelSuffix",{label:k})}),el("span",{textContent:v})));};
 row(t("store.profile.whenToUse"),p.whenToUse);row(t("store.profile.whenNotToUse"),p.whenNotToUse);row(t("store.profile.inputLimits"),p.inputLimits);
 if(p.cost)row(t("store.profile.cost"),LATENCY[p.cost.latency]+(p.cost.resource?t("store.profile.sep")+p.cost.resource:"")+(p.cost.billable?t("store.profile.billable"):""));
 if(p.dataFlow)row(t("store.profile.dataFlow"),(p.dataFlow.leavesServer?t("store.profile.leaves"):t("store.profile.stays"))+p.dataFlow.sends);
 if(p.reliability)row(t("store.profile.reliability"),RELIABILITY[p.reliability.kind]+t("store.profile.sep")+p.reliability.note+(p.reliability.verify?t("store.profile.verify")+p.reliability.verify:""));
 for(const f of p.fallbacks??[])row(t("store.profile.fallback",{when:f.when}),f.then);
 return box;
}
function renderDetail(){
 const {module:m,manifest:raw,activity=[]}=detail;
 const box=el("div");
 box.append(el("div",{className:"row"},el("button",{textContent:t("store.button.back"),onclick:()=>{detail=null;render();}}),el("h3",{textContent:m.name}),badge(STATE[m.state]??m.state,m.state==="enabled"?"enabled":"")));
 box.append(el("p",{textContent:m.description}));
 const dl=el("dl");
 const add=(k,v)=>{if(v!==undefined&&v!==null&&v!=="")dl.append(el("dt",{textContent:k}),el("dd",{textContent:text(v)}));};
 add(t("store.detail.id"),m.id);add(t("store.detail.version"),m.version);add(t("store.detail.publisher"),m.publisher);add(t("store.detail.license"),m.license);add(t("store.detail.runtime"),tmap("store.runtime.",["builtin","declarative","wasm"])[m.runtime]??m.runtime);
 add(t("store.detail.compat"),raw?.coreCompatibility);add(t("store.detail.source"),m.sourceUrl);add(t("store.detail.hash"),m.package?.sha256);add(t("store.detail.key"),m.package?.keyId);add(t("store.detail.rollbackTo"),m.rollbackTo);
 box.append(dl);
 box.append(el("h3",{textContent:t("store.detail.capabilities")}));
 box.append(el("ul",{className:"caps"},...m.capabilities.map(c=>el("li",{},el("strong",{textContent:c.title+" "}),el("code",{textContent:c.id}),el("div",{className:"muted",textContent:c.description}),capProfile(c)))));
 box.append(el("h3",{textContent:t("store.detail.permissions")}));
 for(const p of m.permissions)box.append(el("div",{className:"perm"},badge(RISK[p.risk]??p.risk,p.risk),el("span",{textContent:p.zh}),el("code",{textContent:p.id})));
 if(m.network)box.append(el("div",{className:"box alert"},el("strong",{textContent:t("store.dataFlow.label")}),el("span",{textContent:t("store.network.connects",{hosts:m.network.allow.join(t("store.list.sep")),dataFlow:m.network.dataFlow})})));
 const row=el("div",{className:"row",style:"margin-top:10px"});
 const can=a=>actions.includes(a);
 if(m.state!=="enabled"&&can("enable"))row.append(el("button",{className:"primary",textContent:t("store.action.enable"),disabled:!ready,onclick:()=>preparePlan("enable",m.id)}));
 if(m.state==="enabled")row.append(el("button",{textContent:t("store.action.disable"),disabled:!ready,onclick:()=>preparePlan("disable",m.id)}));
 if(m.source==="package"){
  if(m.rollbackTo&&can("rollback"))row.append(el("button",{textContent:t("store.button.rollbackTo",{version:m.rollbackTo}),disabled:!ready,onclick:()=>preparePlan("rollback",m.id)}));
  if(can("uninstall"))row.append(el("button",{className:"danger",textContent:t("store.action.uninstall"),disabled:!ready,onclick:()=>preparePlan("uninstall",m.id)}));
 }
 if(can("purge"))row.append(el("button",{className:"danger",textContent:t("store.action.purge"),disabled:!ready,onclick:()=>preparePlan("purge",m.id)}));
 box.append(row);
 if(activity.length){box.append(el("h3",{textContent:t("store.detail.recent"),style:"margin-top:12px"}),eventList(activity));}
 view.replaceChildren(box);
}
function renderPlan(){
 const p=plan,box=el("div");
 box.append(el("div",{className:"row"},el("button",{textContent:t("store.button.back"),onclick:()=>{plan=null;render();}}),el("h3",{textContent:t("store.plan.confirmTitle",{action:ACTION[p.action]??p.action,name:p.name||p.module})})));
 const dl=el("dl");const add=(k,v)=>{if(v)dl.append(el("dt",{textContent:k}),el("dd",{textContent:text(v)}));};
 add(t("store.plan.module"),p.module);add(t("store.plan.version"),(p.fromVersion&&p.fromVersion!==p.toVersion?p.fromVersion+" → ":"")+(p.toVersion||""));add(t("store.plan.risk"),RISK[p.risk]);add(t("store.plan.requestedBy"),p.requestedBy==="model"?t("store.plan.byModel"):t("store.plan.byUser"));
 add(t("store.plan.expires"),new Date(p.expiresAt).toLocaleTimeString());box.append(dl);
 if(p.permissions.added.length){box.append(el("h3",{textContent:t("store.plan.addedPermissions")}));for(const q of p.permissions.added)box.append(el("div",{className:"perm"},badge(RISK[q.risk]??q.risk,q.risk),el("span",{textContent:q.zh}),el("code",{textContent:q.id})));}
 if(p.permissions.removed.length)box.append(el("p",{className:"muted",textContent:t("store.plan.removedPermissions",{list:p.permissions.removed.join(t("store.list.sep"))})}));
 if(p.dataFlow)box.append(el("div",{className:"box alert"},el("strong",{textContent:t("store.dataFlow.label")}),el("span",{textContent:p.dataFlow})));
 for(const n of p.notes??[])box.append(el("p",{className:"muted",textContent:t("store.plan.note",{note:n})}));
 if(p.status!=="pending"){box.append(el("p",{textContent:p.status==="committed"?t("store.plan.committed"):t("store.plan.otherStatus",{status:p.status})}));view.replaceChildren(box);return;}
 const consent=consents.get(p.planId);
 if(p.requiresAdmin){
  const cmd="node scripts/estampes-module.js approve "+p.planId;
  box.append(el("div",{className:"box warn"},el("strong",{textContent:t("store.admin.needed")}),
   admin.configured?el("p",{style:"margin:6px 0;font-size:.86rem",textContent:t("store.admin.instructions")}):
    el("p",{style:"margin:6px 0;font-size:.86rem",textContent:t("store.admin.noStorage")}),
   admin.configured?el("code",{textContent:cmd,style:"display:block;user-select:all"}):null));
 }
 const row=el("div",{className:"row"});
 row.append(el("button",{className:"primary",textContent:t("store.plan.confirmButton",{action:ACTION[p.action]??p.action}),disabled:!ready||!consent,onclick:()=>commitPlan(p)}),
  el("button",{textContent:t("store.button.cancel"),onclick:()=>{plan=null;render();}}));
 if(!consent)box.append(el("p",{className:"muted",textContent:t("store.plan.noConsent")}));
 box.append(row);view.replaceChildren(box);
}
function eventList(events){
 return el("ol",{className:"events"},...events.map(e=>el("li",{},el("div",{className:"row"},el("strong",{textContent:KIND[e.kind]??e.kind}),el("small",{textContent:new Date(e.at).toLocaleString()})),
  el("div",{className:"muted",textContent:[e.module,e.capability,e.action,e.toVersion,e.canvas,e.error||e.reason,e.ms!==undefined?e.ms+" ms":"",e.status].filter(Boolean).join(" · ")}))));
}
let activity=[],jobs=[];
function renderActivity(){
 const box=el("div");
 if(jobs.length){box.append(el("h3",{textContent:t("store.activity.jobs")}),el("ol",{className:"events"},...jobs.map(j=>el("li",{},el("div",{className:"row"},el("strong",{textContent:j.module+" "+j.capability}),badge(j.status)),el("small",{textContent:j.jobId+" · "+(j.message||"")})))));}
 box.append(el("h3",{textContent:t("store.activity.title")}),activity.length?eventList(activity):el("p",{className:"muted",textContent:t("store.activity.empty")}));
 box.append(el("button",{textContent:t("store.button.refresh"),disabled:!ready,onclick:loadActivity}));
 view.replaceChildren(box);
}
function render(){
 if(plan)return renderPlan();
 if(detail)return renderDetail();
 if(tab==="activity")return renderActivity();
 renderList();
}
async function call(name,args){
 const result=await request("tools/call",{name,arguments:args});
 if(result?.isError)throw Error(result?.structuredContent?.message||result?.content?.[0]?.text||t("store.error.failed"));
 return result;
}
async function refresh(){
 try{const r=await call("store_get_catalog",{});const s=r.structuredContent;modules=s.modules??modules;available=s.available??[];actions=s.actions??actions;admin=s.admin??admin;render();}
 catch(e){status.textContent=t("store.status.loadFailed",{message:e.message});}
}
async function openDetail(id){
 if(!ready){status.textContent=t("store.status.stillConnecting");return;}
 try{status.textContent=t("store.status.loading");const r=await call("store_get_detail",{module:id});detail=r.structuredContent;plan=null;status.textContent="";render();}
 catch(e){status.textContent=t("store.status.readFailed",{message:e.message});}
}
async function preparePlan(action,module,version){
 try{status.textContent=t("store.status.preparing");const r=await call("store_get_plan",{action,module,...(version?{version}:{})});
  const c=r._meta?.["estampes/consent"];if(c)consents.set(c.planId,c.consent);plan=r.structuredContent.plan;status.textContent=t("store.status.confirmBelow");render();}
 catch(e){status.textContent=t("store.status.cannotPrepare",{message:e.message});}
}
async function commitPlan(p){
 try{status.textContent=t("store.status.applying");
  const r=await call("store_commit_plan",{planId:p.planId,consent:consents.get(p.planId)});
  const s=r.structuredContent;
  modules=s.modules??modules;plan=s.plan;consents.delete(p.planId);
  status.textContent=t("store.status.done",{action:ACTION[p.action]??p.action,name:p.name||p.module});render();tellModel(p);refresh();}
 catch(e){status.textContent=t("store.status.notApplied",{message:e.message});}
}
// The model learns about the change: as quiet context when the host
// supports it, and the user can also say it in the chat.
async function tellModel(p){
 const line=t("store.modelContext.changed",{action:ACTION[p.action]??p.action,name:p.name||p.module,module:p.module,version:p.toVersion?" "+p.toVersion:""});
 try{await request("ui/update-model-context",{content:[{type:"text",text:line}]});}catch{}
}
async function loadActivity(){
 if(!ready)return;
 try{const r=await call("store_get_activity",{limit:60});activity=r.structuredContent.events??[];jobs=r.structuredContent.jobs??[];if(tab==="activity"&&!detail&&!plan)render();}
 catch(e){status.textContent=t("store.status.activityFailed",{message:e.message});}
}
function applyResult(params){
 const s=params?.structuredContent,meta=params?._meta??{};
 if(!s)return;
 if(Array.isArray(s.modules))modules=s.modules;
 if(s.admin)admin=s.admin;
 const c=meta["estampes/consent"];if(c?.planId)consents.set(c.planId,c.consent);
 if(s.plan){plan=s.plan;}
 else if(s.tab&&["browse","installed","activity"].includes(s.tab)){tab=s.tab;for(const b of tabs)b.setAttribute("aria-pressed",String(b.dataset.tab===tab));}
 render();
 if(s.module&&!s.plan&&ready)openDetail(s.module);else if(s.module&&!s.plan)pendingDetail=s.module;
}
let pendingDetail=null;
function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});
 window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
 setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error("Host timeout: "+method))}},15000);})}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const msg=event.data;if(msg?.jsonrpc!=="2.0")return;
 if(typeof msg.id==="number"){const p=pending.get(msg.id);if(!p)return;pending.delete(msg.id);msg.error?p.reject(Error(msg.error.message||JSON.stringify(msg.error))):p.resolve(msg.result);return;}
 if(msg.method==="ui/notifications/tool-result")applyResult(msg.params);
 if(msg.method==="ui/notifications/host-context-changed")i18nHost(msg.params?.locale);
});
let seenOutput=null;
const fromGlobals=()=>{const o=window.openai;if(!o?.toolOutput||o.toolOutput===seenOutput)return;seenOutput=o.toolOutput;applyResult({structuredContent:o.toolOutput,_meta:o.toolResponseMetadata});};
window.addEventListener("openai:set_globals",()=>{i18nHost(window.openai?.locale);fromGlobals()});fromGlobals();
i18nOnChange(()=>render());
render();
(async()=>{try{const init=await request("ui/initialize",{appInfo:{name:"estampes-module-store",version:"__ESTAMPES_VERSION__"},appCapabilities:{availableDisplayModes:["inline","fullscreen"]},protocolVersion:"2026-01-26"});
 i18nHost(init?.hostContext?.locale);
 notify("ui/notifications/initialized",{});ready=true;status.textContent="";
 if(pendingDetail){openDetail(pendingDetail);pendingDetail=null;}else{await refresh();}
 if(tab==="activity")loadActivity();}
 catch(err){status.textContent=t("store.status.hostFailed",{message:String(err.message||err)});}})();
</script>
</body></html>
