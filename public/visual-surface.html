<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estampes — Visual Surface</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;padding:12px;background:Canvas;color:CanvasText}
main{max-width:820px;margin:auto;border:1px solid #8885;border-radius:14px;padding:16px}
header{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h2{font-size:1rem;margin:0}small,.help,#status{color:GrayText}
small{font-size:.75rem}.help{font-size:.84rem;margin:9px 0}
.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button{font:inherit;color:inherit;background:transparent;border:1px solid #8886;border-radius:9px;padding:7px 12px;cursor:pointer}
button[aria-pressed="true"]{background:#356BD6;color:white;border-color:transparent}
button.primary{background:#356BD6;color:white;border-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.view-tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
#focus-choice{font:inherit;font-size:.84rem;border:1px solid #8887;color:CanvasText;background:Canvas;border-radius:8px;padding:7px}
#edit-tools[hidden],#focus-choice[hidden]{display:none}
#context-details{margin:12px 0;border:1px solid #8885;border-radius:10px;padding:0 12px}
#context-details>summary{cursor:pointer;padding:10px 0;font-size:.86rem}
#context-details .context-panel{padding:0;margin:0 0 10px;border:0}
.context-panel{margin:12px 0;padding:12px;border:1px solid #8885;border-radius:10px;display:grid;gap:8px}
.context-panel label{font-size:.85rem;font-weight:600}
.context-panel select,.context-panel textarea,.context-panel input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #8887;background:Canvas;color:CanvasText;font:inherit;font-size:.89rem}
.context-panel textarea{min-height:66px;resize:vertical}
.context-panel .hint{font-size:.75rem;color:GrayText;margin:0}
#surface{display:block;width:100%;height:auto;max-height:640px;border:1px solid #8886;border-radius:10px;touch-action:none;user-select:none;cursor:crosshair}
#status{font-size:.83rem;min-height:1.3rem;overflow-wrap:anywhere}
#caption{font-size:.82rem;color:GrayText}
#findings{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
#findings:empty{display:none}
#findings li{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border:1px solid #8885;border-radius:9px;cursor:pointer;font-size:.86rem}
#findings li:hover{border-color:#8889}
#findings .who{font-weight:700;white-space:nowrap}
#findings .badge{font-size:.72rem;padding:1px 6px;border-radius:6px;border:1px solid #8887;white-space:nowrap;color:GrayText}
#findings .note{overflow-wrap:anywhere}
</style></head><body><main>
<header><h2>Estampes · Visual Surface</h2><small>v__ESTAMPES_VERSION__</small></header>
<p class="help">同一張圖片，同一套座標。<strong>金色＝GPT</strong>、<strong>藍色＝你</strong>；預設顯示原圖，可直接標記、放大，或切換到 GPT 提供的處理後檢視。</p>
<nav class="view-tabs" aria-label="檢視模式">
<button data-view="annotated" aria-pressed="true">標註與編輯</button>
<button data-view="original" aria-pressed="false">原始圖片</button>
<button data-view="zoom" aria-pressed="false">局部放大</button>
<select id="focus-choice" hidden aria-label="放大哪個標註"></select>
</nav>
<div class="toolbar" id="edit-tools" role="group" aria-label="標註工具">
<button data-mode="point" aria-pressed="true">點選</button>
<button data-mode="rect" aria-pressed="false">框選</button>
<button data-mode="arrow" aria-pressed="false">箭頭</button>
<button data-mode="polyline" aria-pressed="false" title="按住拖曳自由畫；滑鼠、繪圖板、Apple Pencil、S Pen 都可以">手繪</button>
<button id="undo">復原</button><button id="clear">清除我的標註</button>
</div>
<svg id="surface" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="可互動的雙向標註畫布">
<defs><marker id="gold-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E4AE57"/></marker>
<marker id="blue-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#579DF6"/></marker></defs>
<g id="scene"></g><g id="processed"></g><g id="assistant-annotations"></g><g id="user-annotations"></g><g id="fresh-annotations"></g><g id="preview"></g>
<rect id="hit" width="640" height="360" fill="transparent"/>
</svg>
<p id="caption">示範底圖 · 原始內容與 SVG 標註分開</p>
<ol id="findings" aria-label="GPT 對各標記的說明"></ol>
<details id="context-details"><summary>補充給 GPT 的目的或問題（選填）</summary><section class="context-panel" aria-label="標註上下文">
<label for="intent">這次標註的目的</label>
<select id="intent">
<option value="">沿用目前對話（預設：指出位置）</option>
<option value="point-out">只是指出「這裡」</option>
<option value="ask-about-region">請解釋這個區域</option>
<option value="answer-question">回答你剛剛問我的問題</option>
<option value="correct-assistant">更正你之前指錯的位置</option>
<option value="compare">比較我標記的東西</option>
<option value="report-issue">指出這裡有問題</option>
</select>
<label for="note">補充一句話（選填，但建議寫）</label>
<textarea id="note" maxlength="500" placeholder="例如：我指的是這棵樹，不是後面的山。或：為什麼這個地方接錯了？"></textarea>
<label for="quote">你在回覆的那句話（選填，手動貼上）</label>
<input id="quote" maxlength="300" placeholder="例如：你剛剛問我哪一個元件發熱？">
<p class="hint">Estampes 不會自動讀取聊天紀錄。送出後 GPT 可呼叫 inspect_visual 取得原始圖片與局部裁切；模型是否真的看到圖片仍須確認。</p>
</section></details>
<div class="actions"><span id="counter">我的標註：0</span>
<button id="send" class="primary" disabled>把標註傳給 GPT</button></div>
<p id="status" role="status" aria-live="polite">正在連接 ChatGPT…</p>
<script type="module">
const NS="http://www.w3.org/2000/svg";
const svg=document.querySelector("#surface"),sceneEl=document.querySelector("#scene"),processedEl=document.querySelector("#processed");
const tabNav=document.querySelector(".view-tabs");
const freshEl=document.querySelector("#fresh-annotations"),findingsEl=document.querySelector("#findings");
// Marks already sent to GPT: the next send labels them context, not focus.
const sentIds=new Set();
const aiEl=document.querySelector("#assistant-annotations"),userEl=document.querySelector("#user-annotations"),previewEl=document.querySelector("#preview");
const hit=document.querySelector("#hit"), status=document.querySelector("#status"),send=document.querySelector("#send"),counter=document.querySelector("#counter");
const intentSelect=document.querySelector("#intent"),noteInput=document.querySelector("#note"),quoteInput=document.querySelector("#quote");
let tabs=[...document.querySelectorAll("[data-view]")];const focusChoice=document.querySelector("#focus-choice"),editTools=document.querySelector("#edit-tools");
let viewMode="annotated",selectedFocusId=null;
const INTENT_TEXT={
 "point-out":"我想指出這個位置",
 "ask-about-region":"請解釋我標記的區域",
 "answer-question":"我正在回答你先前的問題",
 "correct-assistant":"我要更正你先前的指認",
 "compare":"請比較我標記的東西",
 "report-issue":"我想指出這裡的問題"
};
const SCENES={
 landscape:`<rect width="640" height="360" fill="#DBEAF0"/><rect y="230" width="640" height="130" fill="#A4C7A4"/>
 <circle cx="508" cy="73" r="39" fill="#F2C76F"/><path d="M0 255 L167 72 L324 255Z" fill="#90A9AE"/>
 <path d="M188 252 L367 45 L562 252Z" fill="#668F9A"/><path d="M336 82L367 45L403 85L385 78L370 89L353 73Z" fill="#F1F4F3"/>
 <rect x="89" y="229" width="142" height="95" rx="3" fill="#D7A57D"/><path d="M67 233 L159 155 L252 233Z" fill="#955E54"/>
 <rect x="146" y="270" width="35" height="54" fill="#7F5751"/><rect x="108" y="251" width="27" height="26" fill="#F1E1AE"/>
 <path d="M524 316V206" stroke="#6B6954" stroke-width="17"/><circle cx="525" cy="177" r="69" fill="#5C976B"/><circle cx="490" cy="165" r="44" fill="#70A77A"/>
 <path d="M0 329 Q190 307 320 338 T640 324V360H0Z" fill="#88B88F"/>`,
 shapes:`<rect width="640" height="360" fill="#F1EEE7"/>
 <circle cx="157" cy="154" r="72" fill="#D8A35A"/>
 <rect x="296" y="89" width="132" height="132" rx="10" fill="#6D8FB1"/>
 <path d="M495 240L567 95L633 240Z" fill="#87A47B"/>
 <path d="M64 287H578" stroke="#999" stroke-width="3"/><text x="319" y="326" text-anchor="middle" font-size="20" fill="#555">circle · square · triangle</text>`,
 formula:`<rect width="640" height="360" fill="#F4F2EC"/>
 <text x="320" y="185" font-family="Georgia, serif" font-size="98" fill="#34424E" text-anchor="middle">E = mc²</text>
 <path d="M90 231H550" stroke="#D3CEC5" stroke-width="2"/><text x="320" y="278" text-anchor="middle" font-size="20" fill="#76818B">Example formula surface</text>`
};
const SCENE_NAMES={landscape:"風景插畫",shapes:"幾何形狀",formula:"公式"};
// Canvas units: 640×360 for demo scenes; real photos use width 1000 and
// their own aspect ratio, so normalized coordinates map without distortion.
let VW=640,VH=360,imageId=null,photo=null,views=[];
const IMAGE_ID=/^img:[0-9a-f]{16}$/;
const K=()=>VW/640;
const MAX_MARKS=30;let selectedScene="landscape",assistantMarks=[],priorUserMarks=[],userMarks=[],mode="point",ready=false,start=null,seq=0,rpcId=0;
const pending=new Map();
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const node=(tag,attributes,parent)=>{const el=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attributes))el.setAttribute(key,String(value));parent.append(el);return el};
const px=n=>n*VW,py=n=>n*VH;
const round=n=>Math.round(n*10000)/10000;
const in01=v=>typeof v==="number"&&Number.isFinite(v)&&v>=0&&v<=1;
const MAX_POINTS=128;
const valid=(a)=>a&&["point","rect","arrow","polyline"].includes(a.type)&&[a.x,a.y].every(in01)&&
 (a.type==="point"||[a.x2,a.y2].every(in01))&&
 (a.type!=="polyline"||Array.isArray(a.points)&&a.points.length>=2&&a.points.length<=MAX_POINTS&&a.points.every(p=>p&&in01(p.x)&&in01(p.y)));
// Polyline = ordered vertices; x/y/x2/y2 hold its bounding box.
function polylineMark(points,extra={}){
 const xs=points.map(p=>p.x),ys=points.map(p=>p.y);
 return {type:"polyline",points,x:Math.min(...xs),y:Math.min(...ys),x2:Math.max(...xs),y2:Math.max(...ys),...extra};
}
// SVG path for a polyline; `smooth` passes a Catmull–Rom curve through
// every vertex, `closed` joins the ends.
function pathData(a){
 const pts=a.points.map(p=>[px(p.x),py(p.y)]),n=pts.length,closed=a.closed===true;
 if(a.smooth!==true||n<3)return "M"+pts.map(p=>p.join(" ")).join("L")+(closed?"Z":"");
 const at=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
 let d="M"+pts[0].join(" ");
 for(let i=0;i<(closed?n:n-1);i++){
   const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
   d+="C"+[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]].map(v=>Math.round(v*10)/10).join(" ");
 }
 return d+(closed?"Z":"");
}
// Ramer–Douglas–Peucker in canvas units: drops points that lie on the
// stroke's line, keeping corners; loosens until the stroke fits MAX_POINTS.
function simplify(points,tol){
 if(points.length<3)return points;
 const a=points[0],b=points.at(-1),dx=px(b.x-a.x),dy=py(b.y-a.y),len=Math.hypot(dx,dy);
 let worst=0,index=0;
 for(let i=1;i<points.length-1;i++){
   const qx=px(points[i].x-a.x),qy=py(points[i].y-a.y);
   const d=len?Math.abs(qx*dy-qy*dx)/len:Math.hypot(qx,qy);
   if(d>worst){worst=d;index=i;}
 }
 if(worst<=tol)return [a,b];
 return [...simplify(points.slice(0,index+1),tol).slice(0,-1),...simplify(points.slice(index),tol)];
}
// A hand stroke is a smooth curve; ending near its start makes it a loop.
function freehandMark(points){
 const a=points[0],b=points.at(-1);
 const loop=points.length>=4&&Math.hypot(px(b.x-a.x),py(b.y-a.y))<14*K();
 return polylineMark(loop?points.slice(0,-1):points,{smooth:true,...(loop?{closed:true}:{})});
}
function thin(points){
 let tol=.6*K(),out=simplify(points,tol);
 while(out.length>MAX_POINTS){tol*=1.5;out=simplify(points,tol);}
 return out;
}
function renderMarks(layer,items,color,author){
 layer.replaceChildren();
 for(const a of items){
   if(!valid(a))continue;
   const x=px(a.x),y=py(a.y),x2=px(a.x2??a.x),y2=py(a.y2??a.y);
   const k=K();
   if(a.type==="point"){node("circle",{cx:x,cy:y,r:8*k,fill:color,stroke:"#fff","stroke-width":2*k},layer);}
   if(a.type==="rect"){node("rect",{x:Math.min(x,x2),y:Math.min(y,y2),width:Math.abs(x2-x),height:Math.abs(y2-y),rx:3*k,fill:color,"fill-opacity":.12,stroke:color,"stroke-width":3*k},layer);}
   if(a.type==="arrow"){node("line",{x1:x,y1:y,x2,y2,stroke:color,"stroke-width":3*k,"marker-end":author==="AI"?"url(#gold-head)":"url(#blue-head)"},layer);}
   if(a.type==="polyline"){
     const d=pathData(a);
     node("path",{d,fill:"none",stroke:"#17212A","stroke-opacity":.55,"stroke-width":6*k,"stroke-linejoin":"round","stroke-linecap":"round"},layer);
     node("path",{d,fill:"none",stroke:color,"stroke-width":3*k,"stroke-linejoin":"round","stroke-linecap":"round"},layer);
     if(a.smooth!==true)for(const p of [a.points[0],a.points.at(-1)])node("circle",{cx:px(p.x),cy:py(p.y),r:4.5*k,fill:color,stroke:"#fff","stroke-width":1.5*k},layer);
   }
   // Distinguish a guessed model coordinate from a known scene landmark;
   // GPT may claim it inspected the pixels (✓), which is still its own claim.
   const uncertain=author==="AI" && a.grounding!=="scene-anchor" && a.status!=="inspected";
   const label=String((a.status==="inspected"?"✓ ":uncertain?"? ":"")+(a.label||author)).slice(0,64);
   const lx=a.type==="polyline"?px(a.points[0].x):x,ly=a.type==="polyline"?py(a.points[0].y):y;
   const labelNode=node("text",{x:clamp(lx+9*k,5*k,VW-100*k),y:clamp(ly-12*k,14*k,VH-14*k),fill:color,"font-size":15*k,"font-weight":700,stroke:"#17212A","stroke-width":.8*k,"paint-order":"stroke"},layer);
   labelNode.textContent=label;
 }
}
const markOptions=()=>[
 ...assistantMarks.map((mark,i)=>({key:"ai-"+i,mark,author:"AI"})),
 ...priorUserMarks.map((mark,i)=>({key:"prior-"+i,mark,author:"YOU"})),
 ...userMarks.map((mark,i)=>({key:"mine-"+i,mark,author:"YOU"}))
];
const STATUS_TEXT={inspected:"GPT 表示已看過像素",uncertain:"GPT 不確定"};
function renderFindings(){
 findingsEl.replaceChildren();
 for(const item of markOptions()){
   const m=item.mark;if(!m.note&&!m.status)continue;
   const li=document.createElement("li");li.dataset.key=item.key;
   const who=document.createElement("span");who.className="who";who.style.color=item.author==="AI"?"#C98A2E":"#3C7FE0";
   who.textContent=m.label||(item.author==="AI"?"GPT":"YOU");li.append(who);
   if(m.note){const t=document.createElement("span");t.className="note";t.textContent=m.note;li.append(t);}
   if(STATUS_TEXT[m.status]){const b=document.createElement("span");b.className="badge";b.textContent=STATUS_TEXT[m.status];li.append(b);}
   findingsEl.append(li);
 }
}
findingsEl.addEventListener("click",e=>{const li=e.target.closest("li");if(!li)return;selectedFocusId=li.dataset.key;viewMode="zoom";render()});
function refreshFocus(){
 const marks=markOptions(),previous=selectedFocusId;focusChoice.replaceChildren();
 for(const item of marks){
   const option=document.createElement("option");option.value=item.key;
   option.textContent=item.author+" · "+(item.mark.label||item.mark.type);
   focusChoice.append(option);
 }
 selectedFocusId=marks.some(m=>m.key===previous)?previous:(marks.at(-1)?.key??null);
 if(selectedFocusId)focusChoice.value=selectedFocusId;
 const zoomTab=tabs.find(t=>t.dataset.view==="zoom");zoomTab.disabled=!marks.length;
 if(viewMode==="zoom"&&!marks.length)viewMode="annotated";
}
function cropBox(mark){
 const box=mark.type==="rect"||mark.type==="polyline";
 const x=mark.type==="arrow"?mark.x2:(box?(mark.x+mark.x2)/2:mark.x);
 const y=mark.type==="arrow"?mark.y2:(box?(mark.y+mark.y2)/2:mark.y);
 const k=K();
 const width=box?Math.abs(mark.x2-mark.x)*VW+60*k:VW*.34;
 const height=box?Math.abs(mark.y2-mark.y)*VH+34*k:VH*.34;
 const scale=Math.min(1,Math.max(width/VW,height/VH));
 const w=VW*scale,h=VH*scale;
 return [clamp(x*VW-w/2,0,VW-w),clamp(y*VH-h/2,0,VH-h),w,h].join(" ");
}
function renderView(){
 const hideMarks=viewMode!=="annotated";
 const processed=viewMode.startsWith("view-")?views[Number(viewMode.slice(5))]:null;
 processedEl.replaceChildren();
 if(processed){
   const r=processed.region;
   node("rect",{x:0,y:0,width:VW,height:VH,fill:"#000","fill-opacity":.6},processedEl);
   node("image",{href:processed.href,x:r.x*VW,y:r.y*VH,width:(r.x2-r.x)*VW,height:(r.y2-r.y)*VH,preserveAspectRatio:"none"},processedEl);
 }
 for(const b of tabs)b.setAttribute("aria-pressed",String(b.dataset.view===viewMode));
 aiEl.style.display=hideMarks?"none":"";
 freshEl.style.display=hideMarks?"none":"";
 userEl.style.display=hideMarks?"none":"";
 previewEl.style.display=hideMarks?"none":"";
 hit.style.pointerEvents=hideMarks?"none":"auto";
 editTools.hidden=hideMarks;
 svg.style.cursor=hideMarks?"default":"crosshair";
 const marks=markOptions();
 focusChoice.hidden=viewMode!=="zoom"||marks.length<2;
 const focus=marks.find(m=>m.key===selectedFocusId)?.mark;
 const r=processed?.region;
 svg.setAttribute("viewBox",processed?[r.x*VW,r.y*VH,(r.x2-r.x)*VW,(r.y2-r.y)*VH].join(" "):
   viewMode==="zoom"&&focus?cropBox(focus):"0 0 "+VW+" "+VH);
 const title=processed?processed.label+" · 處理後檢視（不含標註）":
   {annotated:"標註與編輯 · AI 金色／使用者藍色",original:"完整原圖 · 不包含標註",zoom:"局部放大 · 不遮擋底圖"}[viewMode];
 document.querySelector("#caption").textContent=(imageId?"照片 "+imageId:SCENE_NAMES[selectedScene])+" · "+title;
}
function render(){
 hit.setAttribute("width",VW);hit.setAttribute("height",VH);
 if(imageId){
   sceneEl.replaceChildren();
   if(photo){node("image",{href:photo,x:0,y:0,width:VW,height:VH,preserveAspectRatio:"none"},sceneEl);}
   else{
     node("rect",{width:VW,height:VH,fill:"#8882"},sceneEl);
     const t=node("text",{x:VW/2,y:VH/2,"text-anchor":"middle","font-size":20*K(),fill:"#888"},sceneEl);
     t.textContent="正在載入照片…";
   }
 }else sceneEl.innerHTML=SCENES[selectedScene];
 renderMarks(aiEl,assistantMarks,"#E4AE57","AI");
 renderMarks(userEl,[...priorUserMarks,...userMarks.filter(m=>sentIds.has(m.id))],"#579DF6","YOU");
 userEl.style.opacity=".55";
 // New (unsent) marks drawn at full strength in their own layer.
 renderMarks(freshEl,userMarks.filter(m=>!sentIds.has(m.id)),"#579DF6","YOU");
 const fresh=userMarks.filter(m=>!sentIds.has(m.id)).length;
 counter.textContent="未送出："+fresh+" · 已送出或先前的標記："+(userMarks.length-fresh+priorUserMarks.length);
 send.disabled=!ready||fresh===0;
 renderFindings();
 refreshFocus();renderView();
}
tabNav.addEventListener("click",e=>{const tab=e.target.closest("[data-view]");if(tab&&!tab.disabled){viewMode=tab.dataset.view;render()}});
function renderViewTabs(){
 for(const old of tabNav.querySelectorAll(".processed-view"))old.remove();
 views.forEach((v,i)=>{const b=document.createElement("button");b.className="processed-view";b.dataset.view="view-"+i;
   b.setAttribute("aria-pressed","false");b.textContent=v.label;tabNav.insertBefore(b,focusChoice);});
 tabs=[...tabNav.querySelectorAll("[data-view]")];
 if(viewMode.startsWith("view-")&&!views[Number(viewMode.slice(5))])viewMode="annotated";
}
focusChoice.addEventListener("change",()=>{selectedFocusId=focusChoice.value;renderView()});
// Hosts re-deliver the same tool data (ChatGPT fires openai:set_globals on
// every resize, e.g. after a tab click changes the height). Only genuinely
// new data may reset the view and the user's unsent marks.
let appliedKey=null;
function applyInput(args){
 if(!args)return;
 const key=JSON.stringify([args.imageId,args.scene,args.width,args.height,args.annotations]);
 if(key===appliedKey)return;
 appliedKey=key;
 if(typeof args.imageId==="string"&&IMAGE_ID.test(args.imageId)){
   if(args.imageId!==imageId){photo=null;views=[];renderViewTabs();}
   imageId=args.imageId;
   const w=Number(args.width),h=Number(args.height);
   VW=1000;VH=w>0&&h>0?Math.round(1000*h/w):750;
 }else if(Object.hasOwn(SCENES,args.scene)){
   selectedScene=args.scene;imageId=null;photo=null;views=[];renderViewTabs();VW=640;VH=360;
 }else return;
 const incoming=Array.isArray(args.annotations)?args.annotations.filter(valid).slice(0,42):[];
 assistantMarks=incoming.filter(a=>a.author!=="user").slice(0,12);
 priorUserMarks=incoming.filter(a=>a.author==="user").slice(0,30);
 userMarks=[];selectedFocusId=null;viewMode="annotated";previewEl.replaceChildren();render();
}
const inRegion=r=>r&&[r.x,r.y,r.x2,r.y2].every(v=>typeof v==="number"&&v>=0&&v<=1)&&r.x2>r.x&&r.y2>r.y;
const dataUrl=img=>img&&/^image\/(png|jpeg)$/.test(img.mimeType)&&typeof img.data==="string"?"data:"+img.mimeType+";base64,"+img.data:null;
function applyResult(result){
 const r=result?.structuredContent;if(r?.kind!=="estampes.visual_surface")return;
 applyInput(r);
 // Pixels travel in widget-only _meta; ChatGPT also exposes it on window.openai.
 const meta=result?._meta??window.openai?.toolResponseMetadata??{};
 if(imageId){
   photo=dataUrl(meta["estampes/image"])??photo;
   const incoming=Array.isArray(meta["estampes/views"])?meta["estampes/views"]:null;
   const next=(incoming??[]).map(v=>({label:String(v?.label??"").slice(0,24),href:dataUrl(v),region:v?.region}))
     .filter(v=>v.label&&v.href&&inRegion(v.region)).slice(0,3);
   const sig=list=>JSON.stringify(list.map(v=>[v.label,v.region,v.href.length]));
   if(incoming&&sig(next)!==sig(views)){views=next;renderViewTabs();}
   if(!photo)status.textContent="照片資料沒有送到畫面；請 GPT 重新呼叫 present_visual。";
 }
 render();
}
function fromPointer(event){const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;
 const matrix=svg.getScreenCTM();if(!matrix)return null;
 const p=point.matrixTransform(matrix.inverse());
 return {x:round(clamp(p.x/VW,0,1)),y:round(clamp(p.y/VH,0,1))};
}
// GPT re-presents earlier user marks (e.g. "YOU 1") in a new canvas, so new
// marks continue the numbering and get ids that cannot collide with them.
const ID_PREFIX="user-"+Math.random().toString(36).slice(2,6)+"-";
function nextLabel(){
 const used=[...priorUserMarks,...userMarks].map(m=>Number(/^YOU (\d+)$/.exec(m.label??"")?.[1]??0));
 return "YOU "+(Math.max(0,...used)+1);
}
function draft(a,b){return {id:"preview",type:mode,x:a.x,y:a.y,...(mode==="point"?{}:{x2:b.x,y2:b.y}),label:nextLabel()};}
function pickMode(next){mode=next;for(const b of document.querySelectorAll("[data-mode]"))b.setAttribute("aria-pressed",String(b.dataset.mode===mode));}
for(const b of document.querySelectorAll("[data-mode]"))b.addEventListener("click",()=>pickMode(b.dataset.mode));
let stroke=[];
hit.addEventListener("pointerdown",e=>{if(!ready||userMarks.length>=MAX_MARKS)return;start=fromPointer(e);if(!start)return;stroke=[start];hit.setPointerCapture(e.pointerId);});
hit.addEventListener("pointermove",e=>{if(!start||mode==="point")return;const p=fromPointer(e);if(!p)return;
 if(mode==="polyline"){
   // Pens and tablets report more samples than pointermove fires; use them all.
   for(const ev of e.getCoalescedEvents?.()??[e]){
     const q=fromPointer(ev),last=stroke.at(-1);
     if(q&&Math.hypot(px(q.x-last.x),py(q.y-last.y))>=1.5*K())stroke.push(q);
   }
   if(stroke.length>1)renderMarks(previewEl,[{...polylineMark(thin(stroke),{smooth:true}),label:""}],"#579DF6","YOU");
   return;
 }
 renderMarks(previewEl,[{...draft(start,p),label:""}],"#579DF6","YOU");});
hit.addEventListener("pointerup",e=>{if(!start)return;const p=fromPointer(e);if(p){
 if(mode==="polyline")stroke.push(p);
 let mark=mode==="polyline"
   ?{...freehandMark(thin(stroke)),id:ID_PREFIX+(++seq),label:nextLabel()}
   :{...draft(start,p),id:ID_PREFIX+(++seq)};
 if(mode!=="point"&&Math.hypot(px(mark.x2-mark.x),py(mark.y2-mark.y))<7*K()){status.textContent="拖曳距離太短，請重試。";}else{userMarks.push(mark);selectedFocusId="mine-"+(userMarks.length-1);status.textContent="已新增標註；可放大檢視，或直接傳給 GPT。";}
 }start=null;previewEl.replaceChildren();render();});
hit.addEventListener("pointercancel",()=>{start=null;stroke=[];previewEl.replaceChildren()});
intentSelect.addEventListener("change",render);
document.querySelector("#undo").addEventListener("click",()=>{userMarks.pop();selectedFocusId=null;render()});
document.querySelector("#clear").addEventListener("click",()=>{userMarks=[];selectedFocusId=null;render()});
function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});
 window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
 setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error("Host timeout: "+method))}},12000);
})}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const msg=event.data;if(msg?.jsonrpc!=="2.0")return;
 if(typeof msg.id==="number"){const p=pending.get(msg.id);if(!p)return;pending.delete(msg.id);msg.error?p.reject(Error(msg.error.message||JSON.stringify(msg.error))):p.resolve(msg.result);return;}
 if(msg.method==="ui/notifications/tool-input")applyInput(msg.params?.arguments);
 if(msg.method==="ui/notifications/tool-result")applyResult(msg.params);
});
render();
// Hosts that set window.openai globals before (or instead of) notifications.
let seenOutput=null,seenMeta=null;
const fromGlobals=()=>{const o=window.openai;if(!o?.toolOutput)return;
 if(o.toolOutput===seenOutput&&o.toolResponseMetadata===seenMeta)return;
 seenOutput=o.toolOutput;seenMeta=o.toolResponseMetadata;
 applyResult({structuredContent:o.toolOutput,_meta:o.toolResponseMetadata});};
window.addEventListener("openai:set_globals",fromGlobals);fromGlobals();
(async()=>{try{await request("ui/initialize",{appInfo:{name:"estampes-visual-surface",version:"__ESTAMPES_VERSION__"},appCapabilities:{},protocolVersion:"2026-01-26"});
 notify("ui/notifications/initialized",{});ready=true;render();status.textContent="已連線，可以任意點選或拖曳標註。";}
 catch(err){status.textContent="ChatGPT 連線失敗："+String(err.message||err)}})();
// The MCP server builds the canonical v0.2-draft event. The widget does
// not invent the preceding conversation or silently infer user intent.
send.addEventListener("click",async()=>{
 const freshIds=userMarks.filter(m=>!sentIds.has(m.id)).map(m=>m.id);
 if(!ready||!freshIds.length)return;
 send.disabled=true;
 const marks=userMarks.map(({id,type,x,y,x2,y2,points,smooth,closed,label})=>({
   id,type,x,y,...(type==="point"?{}:{x2,y2}),...(type==="polyline"?{points,smooth,closed}:{}),label,
   role:sentIds.has(id)?"context":"focus",
   author:"user",grounding:"user-pointer"
 }));
 const intent=intentSelect.value||"point-out";
 const note=noteInput.value.trim().slice(0,500);
 const replyQuote=quoteInput.value.trim().slice(0,300);
 let validated=false,reason="",chatMessage="";
 try{
   status.textContent="正在驗證座標並整理對話上下文…";
   const result=await request("tools/call",{
     name:"validate_visual_annotations",
     arguments:{...(imageId?{imageId}:{scene:selectedScene}),annotations:marks,intent,note,replyQuote}
   });
   if(result?.isError)throw Error("Tool rejected annotations");
   const r=result?.structuredContent;
   if(r?.kind!=="estampes.validated_annotations"||r.count!==marks.length ||
      r?.event?.schemaVersion!=="0.2-draft" ||
      r?.event?.interaction?.intent!==intent ||
      typeof r?.chatMessage!=="string" || !r.chatMessage.trim()) {
     throw Error("Unexpected protocol v0.2 response");
   }
   chatMessage=r.chatMessage;
   validated=true;
 }catch(err){reason=String(err.message||err)}
 if(!validated){
   // Failure fallback: still carry user-supplied intention, image identity,
   // normalized geometry, and arrowhead meaning, without claiming validation.
   chatMessage="我透過 Estampes 做了視覺標註，但伺服器尚未驗證這次資料。\n"+
     "目的："+INTENT_TEXT[intent]+"。\n"+
     (note?"我的補充："+note+"\n":"")+
     (replyQuote?"我手動提供的前文引述："+replyQuote+"\n":
       "沒有前文的精確引述，請勿猜測。\n")+
     (imageId?"照片 imageId="+imageId+"，請用 process_image 檢視標註位置；":
       "SVG 底圖 id=demo:"+selectedScene+" revision=svg-v1 viewBox=640×360，")+
     "原圖左上角為原點，座標為 0..1。\n"+
     "點是位置，框是範圍，箭頭尖端(x2,y2)是目標。\n"+
     "未經驗證的標註："+JSON.stringify(marks);
 }
 try{
   status.textContent=(validated?"座標與意圖已驗證；":"驗證失敗，嘗試傳送原始資料；")+
     "訊息送往 GPT 中…";
   const response=await request("ui/message",{
     role:"user",content:[{type:"text",text:chatMessage}]
   });
   if(response?.isError)throw Error("Host rejected message");
   for(const id of freshIds)sentIds.add(id);
   status.textContent=(validated?"v0.2 上下文事件已提交；":"未驗證標註已提交；")+
     (imageId?"已送出的標記會變淡，下次只問新畫的。":"請確認 GPT 是否呼叫 inspect_visual 並辨識真正的圖片像素。");
 }catch(err){
   status.textContent=(validated?"座標驗證成功；":"座標驗證失敗："+reason+"；")+
     "聊天傳送失敗："+String(err.message||err);
 }
 render();
});
</script></main></body></html>
