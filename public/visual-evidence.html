<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estampes · Visual Evidence</title>
<style>
:root { color-scheme: dark light; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
*{box-sizing:border-box}
body{margin:0;padding:12px;background:Canvas;color:CanvasText}
main{max-width:760px;margin:auto}
h1{font-size:1.12rem;margin:0 0 7px}
small,.muted{color:GrayText}
header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
nav{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
button{font:inherit;font-size:.86rem;color:inherit;background:transparent;border:1px solid #9997;border-radius:8px;padding:7px 12px;cursor:pointer}
button[aria-pressed=true]{background:#4D78D4;color:white;border-color:#4D78D4}
button:disabled{opacity:.5;cursor:default}
figure{margin:0;border:1px solid #9996;border-radius:10px;overflow:hidden;background:#20252a}
img{display:block;width:100%;height:auto;min-height:120px;max-height:520px;object-fit:contain}
figcaption{font-size:.8rem;color:GrayText;padding:8px 10px;background:Canvas}
#details{font-size:.83rem;color:GrayText;word-break:break-word}
#status{font-size:.83rem;color:GrayText;margin:8px 0}
#retry{margin-top:6px}
#viewer[hidden]{display:none}
</style>
</head>
<body>
<main>
<header><h1>Estampes · Visual Evidence</h1><small>v0.4.4 · 真實 PNG 證據</small></header>
<p id="details">準備接收影像資料…</p>
<div id="viewer" hidden>
<nav aria-label="切換影像來源">
<button type="button" data-view="marked" aria-pressed="true">藍色標記全圖</button>
<button type="button" data-view="original" aria-pressed="false">原始完整圖片</button>
<button type="button" data-view="crop" aria-pressed="false">局部放大（無標記）</button>
</nav>
<figure><img id="image" alt="Estampes 完整影像與標註焦點"><figcaption id="caption">藍色標記全圖</figcaption></figure>
</div>
<p id="status" role="status" aria-live="polite">正在與 ChatGPT 建立元件連線…</p>
<button type="button" id="retry" disabled>重新取得圖片</button>
<script type="module">
const resultImage=document.querySelector("#image"),status=document.querySelector("#status");
const caption=document.querySelector("#caption"),details=document.querySelector("#details");
const viewer=document.querySelector("#viewer"),retry=document.querySelector("#retry");
const tabs=Array.from(document.querySelectorAll("[data-view]"));
const titleMap={marked:"藍色標記全圖",original:"原始完整圖片",crop:"局部放大（無標記）"};
const sources={original:"",marked:"",crop:""};
let currentView="marked",lastInput=null,pending=new Map(),seq=0,ready=false;
function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function request(method,params){return new Promise((resolve,reject)=>{
 const id=++seq;pending.set(id,{resolve,reject});
 window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
 setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error("Host timeout: "+method))}},12000);
})}
function inputReceived(args){
 const value=args?.arguments??args?.input??args;
 if(!value||typeof value!=="object")return;
 lastInput=value;
 const scene=String(value.scene??"").slice(0,40);
 const focus=value.focus;
 let message="場景："+scene+" · 原始 SVG viewBox 640×360 · PNG 640×360 pixels";
 if(focus&&typeof focus.x==="number"&&typeof focus.y==="number"){
   message+=" · 焦點="+focus.type+" ("+focus.x+", "+focus.y+")";
   if(typeof focus.x2==="number")message+=" → ("+focus.x2+", "+focus.y2+")";
 }
 details.textContent=message;
 retry.disabled=!ready;
}
function switchView(name){
 if(!sources[name])return;
 currentView=name;
 resultImage.src=sources[name];
 resultImage.alt=titleMap[name]+"；由 Estampes 原始 SVG 轉成 PNG";
 caption.textContent=titleMap[name]+" · 圖片像素由 Estampes 工具回傳";
 for(const tab of tabs)tab.setAttribute("aria-pressed",String(tab.dataset.view===name));
}
function showResult(input){
 const r=input?.result??input?.toolResult??input?.mcp_tool_result??input;
 const items=r?.content??r?.mcp_tool_result?.content??[];
 if(!Array.isArray(items))return false;
 const images=items.filter(v=>v?.type==="image"&&v.mimeType==="image/png"&&
                  typeof v.data==="string"&&/^[A-Za-z0-9+/=\r\n]+$/.test(v.data) &&
                  v.data.length<=3500000);
 if(images.length<3)return false;
 for(const [index,name] of ["original","marked","crop"].entries()){
   sources[name]="data:image/png;base64,"+images[index].data.replace(/\s/g,"");
 }
 viewer.hidden=false;
 switchView(currentView);
 status.textContent="已取得 3 張 PNG：完整原圖、標記全圖、無標記局部裁切。";
 return true;
}
function hydrateCompat(){
 const o=window.openai;
 if(!o)return false;
 return showResult(o.toolResponseMetadata?.mcp_tool_result)||
        showResult(o.toolResponseMetadata?.call_tool_result)||
        showResult(o.toolOutput);
}
for(const tab of tabs)tab.addEventListener("click",()=>switchView(tab.dataset.view));
retry.addEventListener("click",async()=>{
 if(!ready||!lastInput)return;
 retry.disabled=true;status.textContent="重新取得圖片中…";
 try{
   const result=await request("tools/call",{name:"inspect_visual",arguments:lastInput});
   if(!showResult(result))throw Error("工具沒有回傳完整的三張 PNG");
 }catch(e){status.textContent="無法取得 PNG："+String(e.message||e);}
 finally{retry.disabled=false}
});
window.addEventListener("message",event=>{
 if(event.source!==window.parent)return;
 const msg=event.data;if(msg?.jsonrpc!=="2.0")return;
 if(typeof msg.id==="number"){
   const item=pending.get(msg.id);if(!item)return;
   pending.delete(msg.id);msg.error?item.reject(Error(msg.error.message||"Host error")):item.resolve(msg.result);
   return;
 }
 if(msg.method==="ui/notifications/tool-input")inputReceived(msg.params);
 if(msg.method==="ui/notifications/tool-result"){
   if(!showResult(msg.params)){
     status.textContent="工具結果已收到，但宿主未提供三個 PNG image blocks；可嘗試重新取得圖片。";
   }
 }
});
(async()=>{
 try{
   await request("ui/initialize",{
     appInfo:{name:"estampes-evidence-viewer",version:"0.4.4"},
     appCapabilities:{},protocolVersion:"2026-01-26"
   });
   notify("ui/notifications/initialized",{});
   ready=true;retry.disabled=!lastInput;
   if(!hydrateCompat()&&viewer.hidden)status.textContent="畫布已連線，正在接收工具回傳的圖片…";
 }catch(e){status.textContent="元件連線失敗："+String(e.message||e)}
})();
</script>
</main>
</body>
</html>
