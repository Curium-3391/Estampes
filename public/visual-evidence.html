<!doctype html>
<html lang="__ESTAMPES_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estampes · Visual Evidence</title>
<style>
:root { color-scheme: dark light; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
*{box-sizing:border-box}
body{margin:0;padding:12px;background:Canvas;color:CanvasText}
main{max-width:760px;margin:auto}
h1{font-size:1.12rem;margin:0 0 7px}
small,.muted{color:GrayText}
header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
nav{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
button{font:inherit;font-size:.86rem;color:inherit;background:transparent;border:1px solid #9997;border-radius:8px;padding:7px 12px;cursor:pointer}
button[aria-pressed=true]{background:#356BD6;color:white;border-color:#356BD6}
button:disabled{opacity:.5;cursor:default}
figure{margin:0;border:1px solid #9996;border-radius:10px;overflow:hidden;background:#20252a}
img{display:block;width:100%;height:auto;min-height:120px;max-height:520px;object-fit:contain}
figcaption{font-size:.8rem;color:GrayText;padding:8px 10px;background:Canvas}
#details{font-size:.83rem;color:GrayText;word-break:break-word}
#status{font-size:.83rem;color:GrayText;margin:8px 0}
#retry{margin-top:6px}
#viewer[hidden]{display:none}
</style>
</head>
<body>
<main>
<header><h1>Estampes · Visual Evidence</h1><small>v__ESTAMPES_VERSION__ · <span data-i18n="ev.subtitle"></span></small></header>
<p id="details" data-i18n="ev.waiting"></p>
<div id="viewer" hidden>
<nav data-i18n-aria-label="ev.sources">
<button type="button" data-view="marked" aria-pressed="true" data-i18n="ev.view.marked"></button>
<button type="button" data-view="original" aria-pressed="false" data-i18n="ev.view.original"></button>
<button type="button" data-view="crop" aria-pressed="false" data-i18n="ev.view.crop"></button>
</nav>
<figure><img id="image" data-i18n-alt="ev.imageAlt"><figcaption id="caption" data-i18n="ev.view.marked"></figcaption></figure>
</div>
<p id="status" role="status" aria-live="polite" data-i18n="ev.connecting"></p>
<button type="button" id="retry" disabled data-i18n="ev.retry"></button>
<script type="module">
__ESTAMPES_I18N__
const resultImage=document.querySelector("#image"),status=document.querySelector("#status");
const caption=document.querySelector("#caption"),details=document.querySelector("#details");
const viewer=document.querySelector("#viewer"),retry=document.querySelector("#retry");
const tabs=Array.from(document.querySelectorAll("[data-view]"));
const titleMap=i18nMap({marked:"ev.view.marked",original:"ev.view.original",crop:"ev.view.crop"});
const sources={original:"",marked:"",crop:""};
let currentView="marked",lastInput=null,pending=new Map(),seq=0,ready=false;
function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function request(method,params){return new Promise((resolve,reject)=>{
 const id=++seq;pending.set(id,{resolve,reject});
 window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
 setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error("Host timeout: "+method))}},12000);
})}
function inputReceived(args){
 const value=args?.arguments??args?.input??args;
 if(!value||typeof value!=="object")return;
 lastInput=value;
 const scene=String(value.scene??"").slice(0,40);
 const focus=value.focus;
 let message=t("ev.details",{scene});
 if(focus&&typeof focus.x==="number"&&typeof focus.y==="number"){
   message+=t("ev.focus",{type:focus.type,x:focus.x,y:focus.y});
   if(typeof focus.x2==="number")message+=" → ("+focus.x2+", "+focus.y2+")";
 }
 details.textContent=message;
 retry.disabled=!ready;
}
function switchView(name){
 if(!sources[name])return;
 currentView=name;
 resultImage.src=sources[name];
 resultImage.alt=t("ev.alt",{title:titleMap[name]});
 caption.textContent=t("ev.caption",{title:titleMap[name]});
 for(const tab of tabs)tab.setAttribute("aria-pressed",String(tab.dataset.view===name));
}
// Images travel in the tool result's _meta (widget-only); structuredContent
// keeps just the small metadata the model may read. r.images is accepted for
// results cached from servers before 0.4.8.
function showResult(input,meta){
 const r=input?.structuredContent??input?.result?.structuredContent??
   input?.toolResult?.structuredContent??input?.mcp_tool_result?.structuredContent??
   input?.toolOutput??input;
 if(r?.kind!=="estampes.visual_evidence_view")return false;
 const m=meta??input?._meta??input?.result?._meta??input?.toolResult?._meta??input?.mcp_tool_result?._meta;
 const images=m?.["estampes/images"]??r.images;
 if(!images)return false;
 for(const name of ["original","marked","crop"]){
   const b64=images[name];
   if(typeof b64!=="string"||b64.length>3500000||!/^[A-Za-z0-9+/=\s]+$/.test(b64))return false;
   sources[name]="data:image/png;base64,"+b64.replace(/\s/g,"");
 }
 viewer.hidden=false;
 switchView(currentView);
 status.textContent=t("ev.loaded");
 return true;
}
function hydrateCompat(){
 const o=window.openai;
 if(!o)return false;
 return showResult(o.toolOutput,o.toolResponseMetadata)||
        showResult(o.toolResponseMetadata?.mcp_tool_result)||
        showResult(o.toolResponseMetadata?.call_tool_result);
}
for(const tab of tabs)tab.addEventListener("click",()=>switchView(tab.dataset.view));
retry.addEventListener("click",async()=>{
 if(!ready||!lastInput)return;
 retry.disabled=true;status.textContent=t("ev.retrying");
 try{
   const result=await request("tools/call",{name:"present_visual_evidence",arguments:lastInput});
   if(!showResult(result))throw Error(t("ev.incomplete"));
 }catch(e){status.textContent=t("ev.failed",{message:String(e.message||e)});}
 finally{retry.disabled=false}
});
window.addEventListener("message",event=>{
 if(event.source!==window.parent)return;
 const msg=event.data;if(msg?.jsonrpc!=="2.0")return;
 if(typeof msg.id==="number"){
   const item=pending.get(msg.id);if(!item)return;
   pending.delete(msg.id);msg.error?item.reject(Error(msg.error.message||"Host error")):item.resolve(msg.result);
   return;
 }
 if(msg.method==="ui/notifications/tool-input")inputReceived(msg.params);
 if(msg.method==="ui/notifications/tool-result"){
   if(!showResult(msg.params)){
     status.textContent=t("ev.noImages");
   }
 }
});
(async()=>{
 try{
   const init=await request("ui/initialize",{
     appInfo:{name:"estampes-evidence-viewer",version:"__ESTAMPES_VERSION__"},
     appCapabilities:{},protocolVersion:"2026-01-26"
   });
   i18nHost(init?.hostContext?.locale);
   notify("ui/notifications/initialized",{});
   ready=true;retry.disabled=!lastInput;
   if(!hydrateCompat()&&viewer.hidden)status.textContent=t("ev.receiving");
 }catch(e){status.textContent=t("ev.connectFailed",{message:String(e.message||e)})}
})();
</script>
</main>
</body>
</html>
