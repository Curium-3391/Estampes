services:
  - type: web
    name: estampes-mcp
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm test
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Optional: set in the Render dashboard to require ?key=... on /mcp.
      - key: ESTAMPES_ACCESS_KEY
        sync: false
