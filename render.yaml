services:
  - type: web
    name: estampes-mcp
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Set this (a long random string): onrender.com is public, and without
      # a key anyone can use /mcp and read your images. See docs/DEPLOYMENT.md.
      - key: ESTAMPES_ACCESS_KEY
        sync: false
