services:
  - type: web
    name: estampes-mcp
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --no-audit --no-fund && npm test
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
