# Optional overlay: the UVA Beta editor (experimental_workspace) and the
# read-only checkpoint mirror. The UVA store itself is already on in
# compose.yaml (volume uva-beta at /uva-beta).
# docker compose -f compose.yaml -f compose.uva-beta.yaml up -d --build
services:
  estampes:
    environment:
      ESTAMPES_UVA_BETA: "1"
      ESTAMPES_UVA_PROFILE: ${ESTAMPES_UVA_PROFILE:-linux-process-crash-test}
      ESTAMPES_UVA_MIRROR: ${ESTAMPES_UVA_MIRROR:-0}
      ESTAMPES_UVA_MIRROR_MAX_COMMITS: ${ESTAMPES_UVA_MIRROR_MAX_COMMITS:-10000}
