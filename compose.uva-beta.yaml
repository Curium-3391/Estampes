# Explicit overlay; the standard compose deployment remains legacy-only.
# docker compose -f compose.yaml -f compose.uva-beta.yaml up -d --build
services:
  estampes:
    environment:
      ESTAMPES_UVA_BETA: "1"
      ESTAMPES_UVA_BETA_DIR: /uva-beta
      ESTAMPES_UVA_BETA_PROFILE: ${ESTAMPES_UVA_BETA_PROFILE:?Choose linux-process-crash-test or an eligible linux-local-durable mount explicitly}
      ESTAMPES_UVA_MIRROR: ${ESTAMPES_UVA_MIRROR:-0}
      ESTAMPES_UVA_MIRROR_MAX_COMMITS: ${ESTAMPES_UVA_MIRROR_MAX_COMMITS:-300}
    volumes:
      - uva-beta:/uva-beta
volumes:
  uva-beta:
